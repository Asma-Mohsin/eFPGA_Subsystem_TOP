[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "librelane-pdn-obstructions"
version = "0.1.0"
description = "LibreLane flow for generated PDN routing obstructions"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["librelane_plugin_pdn_obstructions*"]